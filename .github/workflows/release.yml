name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build - ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: false
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            use_cross: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross

      - name: Build Binary
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }} -p rustfetch
          else
            cargo build --release --target ${{ matrix.target }} -p rustfetch
          fi

      - name: Package Assets
        shell: bash
        run: |
          ARCHIVE_NAME="rustfetch-${{ github.ref_name }}-${{ matrix.target }}"
          mkdir -p "$ARCHIVE_NAME/docs"
          cp "target/${{ matrix.target }}/release/rustfetch" "$ARCHIVE_NAME/"
          (cd "$ARCHIVE_NAME" && ln -sf rustfetch rfetch)
          cp docs/rustfetch.1 "$ARCHIVE_NAME/docs/"
          cp README.md MODULES.md LICENSE install.sh "$ARCHIVE_NAME/"
          tar -czvf "${ARCHIVE_NAME}.tar.gz" "$ARCHIVE_NAME"
          sha256sum "${ARCHIVE_NAME}.tar.gz" > "${ARCHIVE_NAME}.tar.gz.sha256"
          cp "${ARCHIVE_NAME}.tar.gz" "rustfetch-${{ matrix.target }}.tar.gz"
          cp "${ARCHIVE_NAME}.tar.gz.sha256" "rustfetch-${{ matrix.target }}.tar.gz.sha256"

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            rustfetch-*.tar.gz
            rustfetch-*.tar.gz.sha256
